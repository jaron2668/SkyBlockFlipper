name: Build

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    packages: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Verify
              run: mvn --batch-mode verify # includes spotless:check
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
